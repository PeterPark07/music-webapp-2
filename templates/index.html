<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroMusic - High-Fidelity Web Player</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-hover: #1f293d;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --player-height: 84px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: var(--player-height);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.07) 0%, transparent 40%);
        }

        header {
            padding: 24px 32px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(9, 13, 22, 0.85);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .search-container {
            flex: 1;
            max-width: 540px;
            margin: 0 24px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px 12px 42px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
            background: rgba(255, 255, 255, 0.09);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        main {
            padding: 32px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(0, 240, 255, 0.08);
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }

        .track-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.22s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .track-card:hover {
            background: var(--surface-hover);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .thumb-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #1a2234;
        }

        .thumb-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .track-card:hover .thumb-wrap img {
            transform: scale(1.04);
        }

        .play-overlay {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            color: #0b0f19;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.5);
        }

        .track-card:hover .play-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
        }

        .spinner {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--accent);
            font-size: 16px;
        }

        /* Persistent Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--player-height);
            background: rgba(13, 18, 30, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 280px;
        }

        .player-thumb {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            background: #1a2234;
        }

        .player-track-info {
            overflow: hidden;
        }

        .player-track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-track-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 620px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            transition: color 0.15s, transform 0.15s;
        }

        .control-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--text-main);
            color: #0b0f19;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background 0.15s;
        }

        .play-btn:hover {
            background: var(--accent);
            transform: scale(1.08);
        }

        .seekbar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .time-label {
            font-size: 11px;
            color: var(--text-muted);
            min-width: 38px;
            text-align: center;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            transform: scale(1.3);
        }

        .player-right {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 220px;
            justify-content: flex-end;
        }

        .vol-slider {
            width: 90px !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎵 Aero<span>Music</span></div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search song title, artist, or paste YouTube link..." />
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tabExplore" onclick="showTab('explore')">Explore</button>
            <button class="tab-btn" id="tabHistory" onclick="showTab('history')">History</button>
            <button class="tab-btn" id="tabFavorites" onclick="showTab('favorites')">Favorites</button>
        </div>
    </header>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Recently Played & Trending</h2>
        </div>

        <div class="spinner" id="loadingSpinner">⚡ Resolving high-fidelity tracks...</div>

        <div class="track-grid" id="trackGrid">
            {% for song in recent_songs %}
            <div class="track-card" onclick="playTrack('{{ song.video_id }}', '{{ song.title | escape }}', '{{ song.artist | escape }}', '{{ song.thumbnail }}', '{{ song.duration }}')">
                <div class="thumb-wrap">
                    <img src="{{ song.thumbnail or 'https://img.youtube.com/vi/' + song.video_id + '/hqdefault.jpg' }}" alt="cover" loading="lazy">
                    <div class="play-overlay">▶</div>
                </div>
                <div class="track-title">{{ song.title }}</div>
                <div class="track-artist">{{ song.artist }}</div>
                <div class="track-meta">
                    <span>⏱ {{ song.duration }}</span>
                    <span>🔥 {{ song.play_count }} plays</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Persistent Bottom Music Player -->
    <div class="player-bar">
        <div class="player-left">
            <img id="playerThumb" class="player-thumb" src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Now Playing">
            <div class="player-track-info">
                <div class="player-track-title" id="playerTitle">Select a track</div>
                <div class="player-track-artist" id="playerArtist">AeroMusic Player</div>
            </div>
            <button class="control-btn" id="favBtn" onclick="toggleCurrentFavorite()" title="Favorite track">🤍</button>
        </div>

        <div class="player-center">
            <div class="controls">
                <button class="control-btn" onclick="seekRelative(-10)" title="Rewind 10s">⏮ 10s</button>
                <button class="control-btn play-btn" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
                <button class="control-btn" onclick="seekRelative(10)" title="Forward 10s">10s ⏭</button>
            </div>
            <div class="seekbar-wrap">
                <span class="time-label" id="currentTime">0:00</span>
                <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
                <span class="time-label" id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <span style="font-size: 14px; color: var(--text-muted)">🔊</span>
            <input type="range" id="volBar" class="vol-slider" min="0" max="1" step="0.05" value="1">
        </div>
    </div>

    <audio id="audioElement" preload="auto"></audio>

    <script>
        const audio = document.getElementById('audioElement');
        const searchInput = document.getElementById('searchInput');
        const trackGrid = document.getElementById('trackGrid');
        const spinner = document.getElementById('loadingSpinner');
        const sectionTitle = document.getElementById('sectionTitle');

        const playerThumb = document.getElementById('playerThumb');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const currentTimeLabel = document.getElementById('currentTime');
        const totalDurationLabel = document.getElementById('totalDuration');
        const volBar = document.getElementById('volBar');
        const favBtn = document.getElementById('favBtn');

        let currentTrack = null;
        let searchTimeout = null;

        // --- Search Input Listener (Debounced) ---
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (!query) return;
            searchTimeout = setTimeout(() => performSearch(query), 400);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                performSearch(searchInput.value.trim());
            }
        });

        async function performSearch(query) {
            if (!query) return;
            spinner.style.display = 'block';
            sectionTitle.innerText = `Results for "${query}"`;

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const songs = await res.json();
                renderTracks(songs);
            } catch (err) {
                console.error(err);
            } finally {
                spinner.style.display = 'none';
            }
        }

        function renderTracks(songs) {
            if (!songs || songs.length === 0) {
                trackGrid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No tracks found. Try another search query.</p>';
                return;
            }

            trackGrid.innerHTML = songs.map(s => `
                <div class="track-card" onclick="playTrack('${s.video_id}', '${escapeHtml(s.title)}', '${escapeHtml(s.artist)}', '${s.thumbnail}', '${s.duration}')">
                    <div class="thumb-wrap">
                        <img src="${s.thumbnail || 'https://img.youtube.com/vi/' + s.video_id + '/hqdefault.jpg'}" alt="cover" loading="lazy">
                        <div class="play-overlay">▶</div>
                    </div>
                    <div class="track-title" title="${escapeHtml(s.title)}">${s.title}</div>
                    <div class="track-artist">${s.artist}</div>
                    <div class="track-meta">
                        <span>⏱ ${s.duration}</span>
                        ${s.play_count ? `<span>🔥 ${s.play_count} plays</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // --- Playback Engine ---
        function playTrack(videoId, title, artist, thumbnail, duration) {
            currentTrack = { videoId, title, artist, thumbnail, duration };

            playerTitle.innerText = title;
            playerArtist.innerText = artist;
            playerThumb.src = thumbnail || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            totalDurationLabel.innerText = duration || '--:--';

            // Server-Side Audio Streaming Relay with Range Support (Bypasses 403 & CORS)
            audio.src = `/stream/${videoId}?title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}&thumbnail=${encodeURIComponent(thumbnail)}&duration=${encodeURIComponent(duration)}`;
            audio.play();
            playPauseBtn.innerText = '⏸';
        }

        function togglePlayPause() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerText = '⏸';
            } else {
                audio.pause();
                playPauseBtn.innerText = '▶';
            }
        }

        function seekRelative(seconds) {
            if (!audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
        }

        // Audio Events
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            seekBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeLabel.innerText = formatTime(audio.currentTime);
            totalDurationLabel.innerText = formatTime(audio.duration);
        });

        seekBar.addEventListener('input', () => {
            if (!audio.duration) return;
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        });

        volBar.addEventListener('input', () => {
            audio.volume = volBar.value;
        });

        function formatTime(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Keyboard Shortcuts: Spacebar to Play/Pause
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'ArrowRight') {
                seekRelative(5);
            } else if (e.code === 'ArrowLeft') {
                seekRelative(-5);
            }
        });

        // Tabs Handler
        async function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tabName === 'explore') {
                document.getElementById('tabExplore').classList.add('active');
                sectionTitle.innerText = "Recently Played & Trending";
                const res = await fetch('/api/history');
                const songs = await res.json();
                renderTracks(songs);
            } else if (tabName === 'history') {
                document.getElementById('tabHistory').classList.add('active');
                sectionTitle.innerText = "Your Play History";
                const res = await fetch('/api/history');
                const songs = await res.json();
                renderTracks(songs);
            } else if (tabName === 'favorites') {
                document.getElementById('tabFavorites').classList.add('active');
                sectionTitle.innerText = "Your Favorites";
                const res = await fetch('/api/favorites');
                const songs = await res.json();
                renderTracks(songs);
            }
        }

        async function toggleCurrentFavorite() {
            if (!currentTrack) return;
            const res = await fetch('/api/favorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    video_id: currentTrack.videoId,
                    title: currentTrack.title,
                    artist: currentTrack.artist,
                    thumbnail: currentTrack.thumbnail,
                    duration: currentTrack.duration
                })
            });
            const data = await res.json();
            favBtn.innerText = data.favorited ? '❤️' : '🤍';
        }
    </script>
</body>
</html>
